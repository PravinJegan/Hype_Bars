<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hype Bars — Main Screen</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f14; color: #fff;
      display: flex; flex-direction: column; padding: 3vh 4vw; gap: 3vh;
    }
    [hidden] { display: none !important; }
    button.ghost { background: #1f2937; color: #d1d5db; border: 1px solid #374151; border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; }
    button.ghost:hover { background: #273244; }

    /* ---------- Start screen ---------- */
    #lobby { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5vw; flex-wrap: wrap; }
    .lobbyMain { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.5vh; text-align: center; }
    .lobbyMain h1 { margin: 0; font-size: clamp(3rem, 8vw, 7rem); line-height: 1; letter-spacing: -.02em;
      background: linear-gradient(90deg, #ef4444, #eab308, #22c55e, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lobbyMain .sub { font-size: clamp(1.1rem, 2.2vw, 1.8rem); color: #d1d5db; margin: 0; }
    .lobbyMain .qrBig { width: min(36vh, 70vw); background: #fff; padding: 14px; border-radius: 16px; }
    .lobbyMain .url { font-size: clamp(1rem, 2vw, 1.7rem); font-weight: 700; word-break: break-all; }
    .lobbyMain .count { font-size: clamp(1.2rem, 2.4vw, 2rem); color: #9ca3af; }
    .lobbyMain .count b { color: #fff; font-size: 1.4em; font-variant-numeric: tabular-nums; }
    #startBtn {
      font: inherit; font-size: clamp(1.4rem, 3vw, 2.4rem); font-weight: 800; color: #fff; cursor: pointer;
      background: linear-gradient(90deg, #ef4444, #f97316); border: 0; border-radius: 999px; padding: .6em 2.2em;
      transition: transform .1s;
    }
    #startBtn:hover { transform: scale(1.05); }
    #noKey { color: #6b7280; font-size: .95rem; }

    /* Host-only settings panel */
    #settings { width: min(420px, 100%); background: #171720; border: 1px solid #2a2a36; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    #settings h2 { margin: 0; font-size: 1.25rem; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    #settings h2 small { font-size: .8rem; font-weight: 400; color: #9ca3af; }
    .barRow { display: flex; align-items: center; gap: 10px; }
    .barRow input[type=color] { width: 44px; height: 44px; padding: 0; border: 2px solid #374151; border-radius: 10px; background: none; cursor: pointer; flex: none; }
    .barRow input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
    .barRow input[type=color]::-webkit-color-swatch { border: 0; border-radius: 6px; }
    .barRow input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; color: #fff; background: #0f0f14; border: 1px solid #374151; border-radius: 10px; padding: 10px 12px; }
    .barRow input[type=text]:focus { outline: 2px solid #f97316; border-color: transparent; }
    .barRow input.bad { border-color: #ef4444; }
    .barRow .remove { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #262633; color: #9ca3af; font-size: 1.2rem; cursor: pointer; }
    .barRow .remove:hover { background: #3f1d1d; color: #fca5a5; }
    .barRow .remove:disabled { opacity: .3; cursor: default; background: #262633; color: #9ca3af; }
    .barRow .thumb { width: 44px; height: 44px; border-radius: 10px; border: 2px solid #374151; background: center/cover no-repeat; flex: none; }
    .barRow .imgBtn { flex: none; font-size: .85rem; padding: 8px 10px; white-space: nowrap; }
    .barRow .imgBtn:disabled { opacity: .5; cursor: default; }
    #addBar { align-self: flex-start; }
    #addBar:disabled { opacity: .4; cursor: default; }
    #saveMsg { font-size: .85rem; color: #9ca3af; min-height: 1.2em; }
    #saveMsg.err { color: #fca5a5; }

    /* ---------- Bars screen ---------- */
    #live { flex: 1; display: flex; flex-direction: column; gap: 3vh; min-height: 0; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 2rem; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); }
    .join { display: flex; align-items: center; gap: 1rem; font-size: clamp(1rem, 1.6vw, 1.5rem); color: #d1d5db; }
    .join img { width: clamp(90px, 10vw, 160px); background: #fff; padding: 6px; border-radius: 8px; }
    .join b { color: #fff; display: block; font-size: 1.1em; word-break: break-all; }
    #chart { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 3vw; min-height: 0; }
    .col { flex: 1; max-width: 220px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 1vh; min-width: 0; }
    .col .num { font-size: clamp(1.5rem, 4vw, 3.5rem); font-weight: 800; font-variant-numeric: tabular-nums; }
    .track { width: 100%; flex: 1; display: flex; align-items: flex-end; }
    /* Short, non-bouncy transition so rapid updates move smoothly instead of lagging behind. */
    /* Each bar fills its track and is revealed from the bottom up, so images don't stretch. */
    .bar {
      width: 100%; height: 100%; border-radius: 14px 14px 4px 4px;
      background-position: center; background-size: cover; background-repeat: no-repeat;
      clip-path: inset(100% 0 0 0 round 14px 14px 4px 4px);
      -webkit-clip-path: inset(100% 0 0 0 round 14px 14px 4px 4px);
      transition: clip-path .12s ease-out, -webkit-clip-path .12s ease-out;
    }
    .label { font-size: clamp(1rem, 2vw, 1.6rem); font-weight: 600; text-align: center; overflow-wrap: anywhere; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 1rem; color: #6b7280; font-size: .9rem; }
    footer .host { display: flex; gap: .6rem; }
  </style>
</head>
<body>
  <!-- Start screen -->
  <section id="lobby">
    <aside id="settings" hidden>
      <h2>Title <small>saves automatically</small></h2>
      <div class="barRow"><input type="text" id="titleInput" maxlength="40" placeholder="Title" /></div>
      <h2>Bars</h2>
      <div id="barRows"></div>
      <button class="ghost" id="addBar">+ Add bar</button>
      <div id="saveMsg"></div>
    </aside>
    <div class="lobbyMain">
      <h1 class="titleText">Hype Bars</h1>
      <p class="sub">Scan to join, then get ready to tap!</p>
      <img class="qrBig qr" alt="QR code to join" />
      <div class="url joinUrl">…</div>
      <div class="count"><b class="phones">0</b> <span class="phonesWord">phones</span> joined</div>
      <button id="startBtn" hidden>Start ▶</button>
      <div id="noKey" hidden>Waiting for the host to start…</div>
    </div>
  </section>

  <!-- Bars screen -->
  <section id="live" hidden>
    <header>
      <h1 class="titleText">Hype Bars</h1>
      <div class="join">
        <div>Join at<b class="joinUrl">…</b></div>
        <img class="qr" alt="QR code to join" />
      </div>
    </header>
    <div id="chart"></div>
    <footer>
      <span><span class="phones">0</span> <span class="phonesWord">phones</span> connected</span>
      <div class="host" hidden>
        <button class="ghost" id="reset">Reset</button>
        <button class="ghost" id="toLobby">Back to start</button>
      </div>
    </footer>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    const socket = io();
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const chart = $("#chart");
    const els = {};   // id -> { bar, num }
    const counts = {};
    const MAX_BARS = 8;
    const MAX_LABEL = 24;
    const PALETTE = ["#ef4444", "#3b82f6", "#22c55e", "#eab308", "#a855f7", "#f97316", "#ec4899", "#14b8a6"];

    // Host controls only appear when opened as /display?key=YOUR_ADMIN_KEY
    const adminKey = new URLSearchParams(location.search).get("key");
    $("#startBtn").hidden = !adminKey;
    $("#noKey").hidden = !!adminKey;
    $(".host").hidden = !adminKey;
    $("#settings").hidden = !adminKey;

    function showPhase(phase) {
      $("#lobby").hidden = phase !== "lobby";
      $("#live").hidden = phase !== "live";
    }

    function render() {
      const max = Math.max(10, ...Object.values(counts));
      for (const [id, n] of Object.entries(counts)) {
        const hidden = 100 - (n / max) * 100;
        const clip = `inset(${hidden}% 0 0 0 round 14px 14px 4px 4px)`;
        els[id].bar.style.clipPath = clip;
        els[id].bar.style.webkitClipPath = clip;
        els[id].num.textContent = n;
      }
    }

    // The display itself is a connection too, so subtract 1 for it.
    function setPlayers(n) {
      const phones = Math.max(0, n - 1);
      $$(".phones").forEach((e) => (e.textContent = phones));
      $$(".phonesWord").forEach((e) => (e.textContent = phones === 1 ? "phone" : "phones"));
    }

    function buildChart(bars) {
      chart.innerHTML = "";
      for (const k of Object.keys(els)) delete els[k];
      for (const k of Object.keys(counts)) delete counts[k];
      for (const b of bars) {
        const col = document.createElement("div");
        col.className = "col";
        col.innerHTML = `<div class="num">0</div><div class="track"><div class="bar"></div></div><div class="label"></div>`;
        const bar = col.querySelector(".bar");
        bar.style.backgroundColor = b.color;
        if (b.image) bar.style.backgroundImage = `url("${b.image}")`;
        col.querySelector(".label").textContent = b.label;
        els[b.id] = { bar, num: col.querySelector(".num") };
        counts[b.id] = b.count;
        chart.appendChild(col);
      }
      render();
    }

    // ---------- Host settings: names + colors ----------
    let draft = [];          // [{label, color}] being edited
    let saveTimer = null;

    function setMsg(text, isErr) {
      const m = $("#saveMsg");
      m.textContent = text;
      m.classList.toggle("err", !!isErr);
    }

    function draftProblem() {
      if (draft.some((b) => !b.label.trim())) return "Every bar needs a name.";
      return null;
    }

    function renderRows() {
      const wrap = $("#barRows");
      wrap.innerHTML = "";
      draft.forEach((b, i) => {
        const row = document.createElement("div");
        row.className = "barRow";

        const color = document.createElement("input");
        color.type = "color";
        color.value = b.color;
        color.title = "Pick a color";
        color.addEventListener("input", () => { b.color = color.value; scheduleSave(); });

        const thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.title = "This bar uses an image";
        if (b.image) thumb.style.backgroundImage = `url("${b.image}")`;

        const imgBtn = document.createElement("button");
        imgBtn.className = "ghost imgBtn";
        imgBtn.textContent = b.image ? "Use color" : "Image";
        imgBtn.title = b.image ? "Go back to a solid color" : "Use a picture for this bar";
        imgBtn.addEventListener("click", () => {
          if (b.image) { delete b.image; renderRows(); scheduleSave(true); return; }
          pickImage(b, imgBtn);
        });

        const name = document.createElement("input");
        name.type = "text";
        name.value = b.label;
        name.maxLength = MAX_LABEL;
        name.placeholder = `Bar ${i + 1} name`;
        name.classList.toggle("bad", !b.label.trim());
        name.addEventListener("input", () => {
          b.label = name.value;
          name.classList.toggle("bad", !b.label.trim());
          scheduleSave();
        });

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.textContent = "×";
        remove.title = "Remove this bar";
        remove.disabled = draft.length <= 1;
        remove.addEventListener("click", () => { draft.splice(i, 1); renderRows(); scheduleSave(true); });

        row.append(b.image ? thumb : color, name, imgBtn, remove);
        wrap.appendChild(row);
      });
      $("#addBar").disabled = draft.length >= MAX_BARS;
    }

    // ---------- Bar images ----------
    const MAX_IMAGE_SIDE = 600;

    // Shrinks an image file to at most MAX_IMAGE_SIDE px so it loads fast on phones.
    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          // WebP keeps transparency and is small; browsers that can't make WebP give PNG instead.
          canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("encode"))), "image/webp", 0.85);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("read")); };
        img.src = url;
      });
    }

    function pickImage(bar, btn) {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        btn.disabled = true;
        btn.textContent = "Uploading…";
        setMsg("Uploading image…");
        try {
          const blob = await shrinkImage(file);
          const res = await fetch(`/upload?key=${encodeURIComponent(adminKey)}`, {
            method: "POST",
            headers: { "Content-Type": blob.type },
            body: blob,
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.url) throw new Error(data.error || "Upload failed.");
          bar.image = data.url;
          renderRows();
          scheduleSave(true);
        } catch (e) {
          setMsg(e.message === "read" ? "Couldn't read that file. Try a JPG or PNG." : e.message || "Upload failed.", true);
          renderRows();
        }
      };
      input.click();
    }

    function scheduleSave(now) {
      clearTimeout(saveTimer);
      const problem = draftProblem();
      if (problem) return setMsg(problem, true);
      setMsg("Saving…");
      saveTimer = setTimeout(saveNow, now ? 0 : 400);
    }

    // Returns false if the settings can't be saved yet.
    function saveNow() {
      clearTimeout(saveTimer);
      saveTimer = null;
      const problem = draftProblem();
      if (problem) { setMsg(problem, true); return false; }
      socket.emit("setBars", { key: adminKey, bars: draft.map((b) => ({ label: b.label.trim(), color: b.color, image: b.image })) });
      return true;
    }

    $("#addBar").onclick = () => {
      if (draft.length >= MAX_BARS) return;
      const used = new Set(draft.map((b) => b.color));
      const color = PALETTE.find((c) => !used.has(c)) || PALETTE[draft.length % PALETTE.length];
      draft.push({ label: "", color });
      renderRows();
      $$("#barRows input[type=text]")[draft.length - 1].focus();
      setMsg("Give the new bar a name.", true);
    };

    // ---------- Title ----------
    const titleInput = $("#titleInput");
    let titleTimer = null;

    function showTitle(t) {
      $$(".titleText").forEach((e) => (e.textContent = t));
      document.title = `${t} — Main Screen`;
      if (document.activeElement !== titleInput && !titleTimer) titleInput.value = t;
    }

    titleInput.addEventListener("input", () => {
      clearTimeout(titleTimer);
      titleInput.classList.toggle("bad", !titleInput.value.trim());
      if (!titleInput.value.trim()) { titleTimer = null; return setMsg("The title can't be empty.", true); }
      setMsg("Saving…");
      titleTimer = setTimeout(() => {
        titleTimer = null;
        socket.emit("setTitle", { key: adminKey, title: titleInput.value.trim() });
      }, 400);
    });
    socket.on("title", showTitle);

    socket.on("barsSaved", () => setMsg("Saved ✓ — phones updated."));
    socket.on("barsError", (msg) => setMsg(msg, true));

    // Only reload the editor from the server when the host isn't mid-edit.
    function syncDraft(bars) {
      if (saveTimer || $("#settings").contains(document.activeElement)) return;
      draft = bars.map((b) => (b.image ? { label: b.label, color: b.color, image: b.image } : { label: b.label, color: b.color }));
      renderRows();
    }

    // ---------- Server events ----------
    socket.on("state", ({ bars, title, joinUrl, phase, players }) => {
      showTitle(title);
      buildChart(bars);
      syncDraft(bars);
      setPlayers(players);
      showPhase(phase);

      $$(".joinUrl").forEach((e) => (e.textContent = joinUrl.replace(/^https?:\/\//, "")));
      if (window.qrcode) {
        const qr = qrcode(0, "M");
        qr.addData(joinUrl);
        qr.make();
        const src = qr.createDataURL(8, 0);
        $$(".qr").forEach((img) => (img.src = src));
      }
    });

    socket.on("bars", (bars) => { buildChart(bars); syncDraft(bars); });
    socket.on("phase", showPhase);
    socket.on("players", setPlayers);

    // Server sends bundled count changes ~20x/sec; draw at most once per frame.
    let frameQueued = false;
    socket.on("counts", (list) => {
      for (const { id, count } of list) if (id in counts) counts[id] = count;
      if (frameQueued) return;
      frameQueued = true;
      requestAnimationFrame(() => { frameQueued = false; render(); });
    });

    socket.on("denied", () => alert("Wrong admin key — the server refused that."));

    $("#startBtn").onclick = () => {
      // Save any unsaved edits first; messages arrive at the server in order.
      if (titleTimer) {
        clearTimeout(titleTimer); titleTimer = null;
        if (titleInput.value.trim()) socket.emit("setTitle", { key: adminKey, title: titleInput.value.trim() });
      }
      if (saveTimer && !saveNow()) return;
      if (draftProblem()) return setMsg(draftProblem(), true);
      socket.emit("setPhase", { key: adminKey, to: "live" });
    };
    $("#toLobby").onclick = () => socket.emit("setPhase", { key: adminKey, to: "lobby" });
    $("#reset").onclick = () => {
      if (confirm("Reset all bars to zero?")) socket.emit("reset", adminKey);
    };
  </script>
</body>
</html>
